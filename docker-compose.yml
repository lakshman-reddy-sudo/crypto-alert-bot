version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Production-ready docker-compose stack
#
# Services:
#   bot         — The Discord bot (auto-restarts, health-checked)
#   prometheus  — Scrapes /metrics endpoint  (optional, comment out if unused)
#   grafana     — Dashboard for prometheus metrics (optional)
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d
#   docker compose logs -f bot
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Discord Bot ─────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: crypto-alert-bot:latest
    container_name: crypto_alert_bot

    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Structured JSON logs when running inside Docker
      LOG_FORMAT: json
      LOG_LEVEL: INFO

      # Health check server
      HEALTHCHECK_ENABLED: "true"
      HEALTHCHECK_HOST: "0.0.0.0"
      HEALTHCHECK_PORT: "8080"

    ports:
      # Expose health/metrics endpoint to host for debugging
      # Remove or restrict to internal network in production
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s    # Give Discord handshake + DB connect time to complete

    # Resource limits — prevents a runaway event loop from starving the host
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - bot_internal


  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: crypto_prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - bot_internal

    profiles:
      - monitoring   # Only starts with: docker compose --profile monitoring up


  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: crypto_grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - bot_internal

    profiles:
      - monitoring


# ──────────────────────────────────────────────────────────────────────────────
volumes:
  prometheus_data:
  grafana_data:

networks:
  bot_internal:
    driver: bridge
