# railway.toml — Railway deployment configuration

[build]
builder           = "DOCKERFILE"
dockerfilePath    = "./Dockerfile"
dockerBuildTarget = "runtime"

[deploy]
# Run migrations then start the bot.
# migrate.py is idempotent — safe to run on every deploy.
startCommand = "python migrations/migrate.py && python -u bot.py"

restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Railway healthcheck.
# Railway injects PORT automatically — our app reads it and binds there.
# We use /ready (not /health) so Railway waits for Discord + DB + WS
# to all be connected before marking the deploy successful.
healthcheckPath    = "/ready"
healthcheckTimeout = 120

[environments.production.variables]
LOG_FORMAT          = "json"
LOG_LEVEL           = "INFO"
HEALTHCHECK_ENABLED = "true"LOG_LEVEL             = "INFO"
HEALTHCHECK_ENABLED   = "true"
HEALTHCHECK_PORT      = "8080"
PYTHON_ENV            = "production"
