# railway.toml
[build]
builder           = "DOCKERFILE"
dockerfilePath    = "./Dockerfile"
dockerBuildTarget = "runtime"

[deploy]
startCommand            = "python migrations/migrate.py && python -u bot.py"
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 10
```

Scroll down → click **"Commit changes"**. This removes the healthcheck that was killing your deploys. Railway will now just check that the process is alive instead of probing an HTTP endpoint.

**But actually — skip Railway entirely and use Render instead. Here's why Render is better for you:**

| | Railway | Render (Background Worker) |
|---|---|---|
| Needs HTTP healthcheck | ✅ Yes (this is your problem) | ❌ No |
| Free tier | Trial credit only | ✅ 750 hrs/month free |
| Discord bot support | Works but awkward | Perfect fit |
| Setup complexity | Medium | Very simple |

