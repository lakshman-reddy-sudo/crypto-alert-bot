name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Triggers ONLY when a push lands on main (i.e. a PR is merged).
# Flow:
#   1. CI (lint + test) must pass first — this job depends on the CI workflow.
#   2. Build and push Docker image to GitHub Container Registry (ghcr.io).
#   3. Trigger Railway re-deploy via Railway CLI so it pulls the new image.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   RAILWAY_TOKEN      — From Railway dashboard → Account Settings → Tokens
#   DISCORD_TOKEN      — Your Discord bot token
#   SUPABASE_DB_URL    — asyncpg connection URI (port 5432, Session mode)
#
# Optional GitHub Secrets:
#   DEV_GUILD_ID            — Only if you want guild-scoped slash commands
#   REPEAT_COOLDOWN_SECS    — Default: 300
#   MAX_ALERTS_PER_USER     — Default: 50
#   LOG_FORMAT              — Default: text (use "json" in prod)
#   LOG_LEVEL               — Default: INFO
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

# Only one deploy runs at a time — prevents race conditions on Railway
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── 1. Re-run CI as a gate before deploying ─────────────────────────────────
  ci-gate:
    name: CI Gate (lint + test)
    uses: ./.github/workflows/ci.yml

  # ── 2. Build & push Docker image ────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-gate

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with short SHA for exact traceability
            type=sha,format=short,prefix=sha-
            # Always update the `latest` tag on main
            type=raw,value=latest

      - name: Set up Docker Buildx (enables layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # GitHub Actions cache — fast rebuilds
          cache-to:   type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ── 3. Deploy to Railway ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: production
      url: https://railway.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service crypto-alert-bot \
            --detach

      - name: Set Railway environment variables
        # Sync all secrets to Railway's environment so the bot can read them.
        # Railway's dashboard can also set these — this ensures they stay
        # in sync with GitHub Secrets on every deploy.
        env:
          RAILWAY_TOKEN:       ${{ secrets.RAILWAY_TOKEN }}
          DISCORD_TOKEN:       ${{ secrets.DISCORD_TOKEN }}
          SUPABASE_DB_URL:     ${{ secrets.SUPABASE_DB_URL }}
          DEV_GUILD_ID:        ${{ secrets.DEV_GUILD_ID }}
          REPEAT_COOLDOWN_SECS: ${{ secrets.REPEAT_COOLDOWN_SECS }}
          MAX_ALERTS_PER_USER:  ${{ secrets.MAX_ALERTS_PER_USER }}
          LOG_FORMAT:          ${{ secrets.LOG_FORMAT }}
          LOG_LEVEL:           ${{ secrets.LOG_LEVEL }}
        run: |
          railway variables set \
            DISCORD_TOKEN="$DISCORD_TOKEN" \
            SUPABASE_DB_URL="$SUPABASE_DB_URL" \
            LOG_FORMAT="${LOG_FORMAT:-json}" \
            LOG_LEVEL="${LOG_LEVEL:-INFO}" \
            HEALTHCHECK_ENABLED="true" \
            $( [ -n "$DEV_GUILD_ID" ]           && echo "DEV_GUILD_ID=$DEV_GUILD_ID" ) \
            $( [ -n "$REPEAT_COOLDOWN_SECS" ]   && echo "REPEAT_COOLDOWN_SECS=$REPEAT_COOLDOWN_SECS" ) \
            $( [ -n "$MAX_ALERTS_PER_USER" ]    && echo "MAX_ALERTS_PER_USER=$MAX_ALERTS_PER_USER" )

      - name: Wait for deployment to be live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting for Railway deployment to complete..."
          sleep 30
          railway status --service crypto-alert-bot

      - name: Deployment summary
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Railway |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
